<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register and Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(120deg, #285c43, #9caf00);
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            min-height: 550px;
            background: #fff;
            border-radius: 35px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .welcome-panel {
            width: 50%;
            background: #004b57;
            color: white;
            border-radius: 35% 35% 35% 35% / 0 35% 35% 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .welcome-panel h1 {
            font-size: 32px;
            margin-bottom: 25px;
        }

        .welcome-panel p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 35px;
            max-width: 330px;
        }

        .signin-btn {
            background: transparent;
            border: 2px solid #b8d0d3;
            color: white;
            padding: 12px 45px;
            cursor: pointer;
            font-weight: bold;
            min-width: 170px;
        }

        /* Right registration panel */
        .register-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 35px;
        }
        .register-panel h1 {
            font-size: 32px;
            margin-bottom: 25px;
            color: #111;
        }

        .social-icons {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .social-icons a {
            width: 45px;
            height: 45px;
            border: 1px solid #4e8790;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #00505b;
            font-weight: bold;
        }

        .or {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #555;
            margin-bottom: 12px;
            text-align: center;
        }

        .register-form {
            width: 100%;
            max-width: 370px;
        }

        .register-form input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: none;
            outline: none;
            background: #ccc;
            font-size: 14px;
        }

        .signup-btn {
            display: block;
            margin: 5px auto 0;
            width: 55%;
            padding: 13px;
            background: #c4c900;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #aab000;
        }

        .signin-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .container {
                flex-direction: column;
                border-radius: 25px;
            }

            .welcome-panel,
            .register-panel {
                width: 100%;
            }

            .welcome-panel {
                min-height: 300px;
                border-radius: 25px 25px 50px 50px;
            }

            .register-panel {
                padding: 35px 20px;
            }

            .welcome-panel h1,
            .register-panel h1 {
                font-size: 27px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="welcome-panel">
            <h1>Welcome Back!</h1>

            <p>
                Provide your personal details to use all features
            </p>

            <button class="signin-btn" type="button"
                    onclick="showSignIn()">
                SIGN IN
            </button>
        </div>

        <div class="register-panel">
            <h1>Register With</h1>

            <div class="social-icons">
                <a href="#" aria-label="Google">G+</a>
                <a href="#" aria-label="Facebook">f</a>
                <a href="#" aria-label="GitHub">⌘</a>
                <a href="#" aria-label="LinkedIn">in</a>
            </div>

            <div class="or">OR</div>

            <p class="subtitle">
                Fill Out The Following Info For Registration
            </p>

            <form class="register-form" onsubmit="register(event)">
                <input type="text" id="name"
                       placeholder="Name" required>

                <input type="email" id="email"
                       placeholder="Email" required>

                <input type="password" id="password"
                       placeholder="Password" minlength="8" required>

                <button class="signup-btn" type="submit">
                    SIGN UP
                </button>
            </form>
        </div>

    </div>

    <script>
        function register(event) {
            event.preventDefault();

            alert("Registration form submitted successfully!");
        }

        function showSignIn() {
            alert("Sign in page is not connected yet.");
        }
    </script>

</body>
</html>
